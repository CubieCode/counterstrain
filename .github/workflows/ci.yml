name: CI
# Mod: build, datagen drift check and gametests. Pack: packwiz index check.
# Docs-only changes skip both jobs. `ci-ok` always reports, so the main branch
# ruleset requires it instead of the path-dependent jobs.
#
# Runners: vars.RUNNER selects them (JSON, e.g. ["self-hosted","foundry"]);
# unset means ubuntu-latest. The repository is public, so pull requests from
# forks always run on ubuntu-latest and never execute untrusted code on foundry. Self-hosted jobs run as `lab` without sudo, so no
# step may install system packages. Java comes from setup-java (Temurin 21,
# matching .sdkmanrc); packwiz is built by tools/install-packwiz.sh.
# Integration-test mods (KubeJS, EMI, JEI, ...) are disabled here so CI tests
# Remission on its own and does not depend on Modrinth/FTB Maven uptime.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  mod:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mod
    env:
      ORG_GRADLE_PROJECT_dev_runtime_mods: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # With caching on, the post step stops every Gradle daemon, which
          # on foundry kills other jobs' and Orca lanes' builds (they share
          # ~/.gradle). Self-hosted runners keep ~/.gradle anyway.
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
      - run: ./gradlew build --console=plain
      - run: ./gradlew runData --console=plain
      - name: Check generated resources are committed
        working-directory: .
        run: |
          git diff --exit-code -- mod/src/generated
          untracked="$(git ls-files --others --exclude-standard -- mod/src/generated)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::runData produced uncommitted files; run it locally and commit them"
            exit 1
          fi
      - run: ./gradlew runGameTestServer --console=plain

  pack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install packwiz
        run: |
          PACKWIZ_BIN_DIR="$RUNNER_TEMP/bin" tools/install-packwiz.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: tools/pack.sh check

  ci-ok:
    needs: [changes, mod, pack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
