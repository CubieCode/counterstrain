name: Release mod
# Tag mod-v<version> (matching mod_version in mod/gradle.properties) to build
# Remission and attach the jar to a draft GitHub release.
# Modrinth/CurseForge publishing is not wired yet (roadmap phase 11); see the
# release skill. A human reviews and publishes the draft.
on:
  push:
    tags: ['mod-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_dev_runtime_mods: 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches mod_version
        run: |
          version="$(sed -n 's/^mod_version=//p' mod/gradle.properties)"
          if [ "${GITHUB_REF_NAME}" != "mod-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match mod_version ${version}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: mod
        run: ./gradlew build runGameTestServer --console=plain
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "mod/build/libs/remission-${VERSION}.jar" \
            --draft --title "Remission ${VERSION}" \
            --notes "Remission ${VERSION} for Minecraft 1.21.1 (NeoForge). See CHANGELOG."
      # TODO(phase 11): publish to Modrinth and CurseForge (mc-publish or
      # Minotaur/CurseGradle) once project IDs and tokens exist.
