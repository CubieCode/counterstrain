name: GPU client smoke test
# Runs every harness scene (tools/run-scenes.sh: all in one game session of
# tools/run-client-headless.sh --scene …) on foundry's RTX 4070 through Xvfb +
# VirtualGL. A scene fails if the log does not name the GPU renderer, the game
# crashes or times out, the harness does not report status=ok, or its
# screenshots differ from the reviewed references (tools/compare-screenshots.sh).
# Logs, screenshots, diffs and the summary are uploaded either way.
# Triggers: manual dispatch, or a same-repo PR carrying the `gpu-smoke` label
# (runs when the label is added and on each push while it stays).
# The runner is self-hosted on foundry: no sudo, Xvfb and /opt/VirtualGL
# provided by the host. It shares the GPU lock with local Orca lanes and other
# PRs' runs as long as all of them resolve the same lock file (the same user's
# ~/.cache/counterstrain/gpu.lock, or COUNTERSTRAIN_GPU_LOCK_FILE set to a
# shared path), so a job may wait for their client runs. See the
# headless-client skill.
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: Scene IDs to run, separated by spaces or commas (blank runs all)
        default: ''
      resolution:
        description: Virtual display and window size
        default: 1920x1080
      scene_timeout:
        description: Seconds each scene may run once the GPU lock is held
        default: '600'
  pull_request:
    types: [labeled, synchronize, reopened]
permissions:
  contents: read
# One group per PR: a push cancels that PR's older run (run-scenes.sh stops
# its client on the runner's SIGINT). Runs for other labels, and manual
# dispatches, get a group of their own so they never cancel a real run. Runs of
# different PRs wait for each other on the GPU lock, not here: a shared group
# keeps only one pending run and silently cancels the rest.
concurrency:
  group: >-
    gpu-smoke-${{ (github.event_name == 'pull_request' &&
    (github.event.action != 'labeled' || github.event.label.name == 'gpu-smoke'))
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scenes:
    # Fork PRs never reach the self-hosted runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'gpu-smoke') &&
       (github.event.action != 'labeled' || github.event.label.name == 'gpu-smoke'))
    runs-on: [self-hosted, foundry, gpu]
    timeout-minutes: 90
    env:
      SCENES: ${{ inputs.scenes || '' }}
      RESOLUTION: ${{ inputs.resolution || '1920x1080' }}
      SCENE_TIMEOUT: ${{ inputs.scene_timeout || '600' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check host prerequisites
        run: |
          command -v xvfb-run
          test -x /opt/VirtualGL/bin/vglrun
      - name: Run harness scenes
        # exec, so a cancellation's SIGINT reaches run-scenes.sh itself.
        run: >-
          exec tools/run-scenes.sh
          --scenes "$SCENES"
          --resolution "$RESOLUTION"
          --timeout "$SCENE_TIMEOUT"
