name: GPU client smoke test
# Launches the dev client on foundry's RTX 4070 through Xvfb + VirtualGL,
# fails unless the log names the GPU renderer, and uploads logs and images.
# Manual for now; the phase 1 harness will add a fixed test scene.
# The runner is `lab` on foundry: no sudo, Xvfb and /opt/VirtualGL provided by
# the host. See the headless-client skill.
on:
  workflow_dispatch:
    inputs:
      timeout:
        description: Seconds to run the client before stopping it
        default: '180'
      resolution:
        description: Virtual display and window size
        default: 1920x1080
permissions:
  contents: read
concurrency:
  group: gpu-smoke
  cancel-in-progress: false
jobs:
  client:
    runs-on: [self-hosted, foundry, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check host prerequisites
        run: |
          command -v xvfb-run
          test -x /opt/VirtualGL/bin/vglrun
      - name: Run client headlessly
        run: >-
          tools/run-client-headless.sh
          --timeout "${{ inputs.timeout }}"
          --resolution "${{ inputs.resolution }}"
      - name: Collect screenshots
        if: always()
        run: tools/collect-screenshots.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-smoke-${{ github.run_id }}
          path: |
            .local/runs/client-*/
            .local/screenshots/2*/
          if-no-files-found: warn
