org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod
mod_id=remission
mod_name=Remission
# SPDX identifier; the full text is LICENSE at the repository root (also packed into the jar).
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.cubiecode.remission
mod_authors=CubieCode
mod_description=The Strain spreads through mobs and land; research it, purify it and cure it.

## Development runtime
# Integration-test mods added to runClient/runServer only (never published as dependencies).
# Turn off with -Pdev_runtime_mods=false or by editing this line.
dev_runtime_mods=true
# EMI among the dev runtime mods; -Pdev_runtime_emi=false runs JEI alone.
dev_runtime_emi=true
# Opt-in JetBrains Runtime for client/server runs with enhanced hot-swap: -Pdev_jbr=true
dev_jbr=false

# Modrinth Maven versions. Use a version ID instead of a version number when a project
# publishes the same number for several loaders (Modrinth Maven may resolve the Fabric jar).
kubejs_version=2101.7.2-build.377
rhino_version=2101.2.7-build.85+Rhino-1.21
better_advanced_tooltips_version=2101.1.0-build.5
probejs_version=8.0.3
# JEI 19.51.0.418 for NeoForge (number is shared with Fabric/Forge builds)
jei_version=ufHUqt9b
emi_version=1.1.24+1.21.1+neoforge
journeymap_version=1.21.1-6.0.9+neoforge
# Curios API 9.5.1+1.21.1 for NeoForge (version ID, the file the pack pins)
curios_version=yohfFbgD
# JourneyMap API (maven.blamejared.com) that JourneyMap 6.0.9 bundles
journeymap_api_version=2.0.0-1.21.1
mekanism_version=10.7.19.85
ae2_version=19.2.18
guideme_version=21.1.19
architectury_version=13.0.11+neoforge
# FTB mods are not on Modrinth; they come from maven.ftb.dev
ftb_library_version=2101.1.37
ftb_teams_version=2101.1.11
ftb_quests_version=2101.1.36
# GeckoLib 4.9.3 for NeoForge 1.21.1 (version ID; the same file the pack pins). Required: the nidus is a GeckoLib
# animated block entity.
geckolib_version=Grwn5rUB
