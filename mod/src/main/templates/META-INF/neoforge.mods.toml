modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/CubieCode/counterstrain/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional integrations (integration/<modid>/): never required; the range only rejects versions whose API differs.
# Mekanism 10.7 unified gases into chemicals, which the miasma chemical (P7.1) is built on.
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="optional"
    versionRange="[10.7,)"
    ordering="NONE"
    side="BOTH"

# The recipe viewer plugin (integration/jei/, P7.2) is built against the JEI 19.51 API; EMI shows it through its JEI
# compatibility.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.51,)"
    ordering="NONE"
    side="CLIENT"

# The team query's FTB Teams source (integration/ftbteams/, P4.12) is built against FTB Teams 2101.1.
[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="optional"
    versionRange="[2101.1,)"
    ordering="NONE"
    side="BOTH"
