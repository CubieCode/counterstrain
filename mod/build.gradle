plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21. Builds and CI use Temurin 21 (.sdkmanrc);
// foojay downloads one if no local Java 21 exists.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude '.cache'
}

// Dev-only scene harness (ROADMAP P1.1): its own mod, loaded only by runClient and never
// packaged in the jar. See tools/run-client-headless.sh --scene.
sourceSets {
    harness {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'FTB'
                url = 'https://maven.ftb.dev/releases'
            }
        }
        filter {
            includeGroup 'dev.ftb.mods'
        }
    }
    // JourneyMap's API (integration/journeymap/, P8.2) is published only here.
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'info.journeymap'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        remission_harness {
            sourceSet(sourceSets.harness)
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            // The client run alone carries the harness mod; it stays inert unless a scene is set.
            sourceSet = sourceSets.harness
            loadedMods = [mods."${mod_id}", mods.remission_harness]
            def harnessScene = project.findProperty('harness_scene')
            if (harnessScene) {
                systemProperty 'remission.harness.scene', harnessScene
                def harnessOutput = project.findProperty('harness_output')
                if (harnessOutput) {
                    systemProperty 'remission.harness.output', harnessOutput
                }
                def harnessArgs = project.findProperty('harness_args')
                if (harnessArgs) {
                    systemProperty 'remission.harness.args', harnessArgs
                }
                def harnessTimeout = project.findProperty('harness_timeout')
                if (harnessTimeout) {
                    systemProperty 'remission.harness.timeout', harnessTimeout
                }
            }
            // Window size; tools/run-client-headless.sh matches it to the virtual display.
            programArguments.addAll '--width', project.findProperty('client_width') ?: '1280',
                    '--height', project.findProperty('client_height') ?: '720'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            loadedMods = [mods."${mod_id}"]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered gametest, then exits non-zero on failure.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            loadedMods = [mods."${mod_id}"]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            loadedMods = [mods."${mod_id}"]
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

// localRuntime: present in dev runs, never published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    harnessCompileClasspath.extendsFrom compileClasspath
    harnessRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
    // Required: the nidus's animated model (client/NidusRenderer) and its block entity's animation controllers.
    implementation "maven.modrinth:geckolib:${geckolib_version}"

    // Optional mod-side integrations (integration/<modid>/): compiled against, never bundled or required,
    // and loaded only when ModList reports the mod.
    compileOnly "maven.modrinth:mekanism:${mekanism_version}"
    // Recipe viewer (integration/jei/, P7.2): a JEI plugin, which EMI also shows through its JEI compatibility.
    compileOnly "maven.modrinth:jei:${jei_version}"
    // Team query source (integration/ftbteams/, P4.12). FTB Teams' events are Architectury events; FTB Library holds
    // types in its API signatures. Same versions as the dev runtime entries below.
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly "maven.modrinth:architectury-api:${architectury_version}"
    // Curios (integration/curios/, P5.3): revenants hold Curios slot items; gametests equip slots through its API.
    compileOnly "maven.modrinth:curios:${curios_version}"
    // Map overlay (integration/journeymap/, P8.2): a client plugin found by JourneyMap's annotation scan.
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    // KubeJS bindings (integration/kubejs/, P8.3): a KubeJS plugin listed in kubejs.plugins.txt, which only KubeJS
    // reads. Same versions as the dev runtime entries below.
    compileOnly "maven.modrinth:kubejs:${kubejs_version}"
    compileOnly "maven.modrinth:rhino:${rhino_version}"
    // The harness opens recipe categories in EMI's own screen (tech/recipe_viewer scenes).
    harnessCompileOnly "maven.modrinth:emi:${emi_version}"

    if (project.dev_runtime_mods.toBoolean()) {
        localRuntime "maven.modrinth:rhino:${rhino_version}"
        localRuntime "maven.modrinth:better-advanced-tooltips:${better_advanced_tooltips_version}"
        localRuntime "maven.modrinth:kubejs:${kubejs_version}"
        localRuntime "maven.modrinth:probejs:${probejs_version}"
        localRuntime "maven.modrinth:architectury-api:${architectury_version}"
        localRuntime("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
        localRuntime("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
        localRuntime("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }
        // EMI replaces JEI's UI and shows JEI plugins' recipes through its JEI compatibility.
        localRuntime "maven.modrinth:jei:${jei_version}"
        // -Pdev_runtime_emi=false leaves EMI out, so JEI's own screens show (JEI alone).
        if (project.dev_runtime_emi.toBoolean()) {
            localRuntime "maven.modrinth:emi:${emi_version}"
        }
        localRuntime "maven.modrinth:mekanism:${mekanism_version}"
        localRuntime "maven.modrinth:guideme:${guideme_version}"
        localRuntime "maven.modrinth:ae2:${ae2_version}"
        localRuntime "maven.modrinth:journeymap:${journeymap_version}"
        localRuntime "maven.modrinth:curios:${curios_version}"
    }
}

// The KubeJS binding gametests (KubeJSBindingTests, P8.3) run the pack's sample script and a probe script; KubeJS
// reads server scripts from the gametest run's kubejs/ folder, so they are synced there before each run.
def syncGameTestScripts = tasks.register('syncGameTestScripts', Sync) {
    from(rootProject.file('../pack/kubejs/server_scripts/remission'))
    from('src/gametest/kubejs/server_scripts')
    into('run/gametest/kubejs/server_scripts')
}
if (project.dev_runtime_mods.toBoolean()) {
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        dependsOn syncGameTestScripts
    }
}

// Opt-in JetBrains Runtime for interactive runs (enhanced class redefinition).
// Builds, datagen, gametests and CI always use the default Temurin toolchain.
if (project.dev_jbr.toBoolean()) {
    def jbrLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.JETBRAINS
    }
    ['runClient', 'runServer'].each { name ->
        tasks.named(name).configure {
            javaLauncher = jbrLauncher
            jvmArgs '-XX:+AllowEnhancedClassRedefinition'
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

// Ship the repository's MIT license inside the jar.
def licenseName = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    from(rootProject.file('../LICENSE')) {
        rename { licenseName }
    }
}

// `build` compiles the harness so it cannot rot, but the jar never contains it.
tasks.named('check').configure {
    dependsOn tasks.named('harnessClasses')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
